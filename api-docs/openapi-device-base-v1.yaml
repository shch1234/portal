openapi: 3.0.3
info:
  title: 设备基础数据业务模块 API 文档
  description: |
    weili-iot-portal 业务模块中设备基础数据（device-base）模块的 REST API 接口文档。
    
    功能覆盖设备基础信息、设备配置、设备型号、设备类型、组织单元以及设备关系等主数据维护。
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api/device-base/v1
    description: 设备基础数据 API 基础路径

tags:
  - name: 设备基础信息
    description: 设备基础信息 CRUD 与查询接口
  - name: 设备配置
    description: 设备网络/位置信息配置接口
  - name: 设备型号
    description: 设备型号库维护接口
  - name: 设备类型
    description: 设备主类型与子类型维护接口
  - name: 组织单元
    description: 厂区/车间/产线组织结构维护接口
  - name: 设备关系
    description: 设备间关系维护接口

security:
  - bearerAuth: []

paths:
  # ========== 设备基础信息 ==========
  /device-info:
    post:
      tags:
        - 设备基础信息
      summary: 创建设备基础信息
      operationId: createDeviceBaseInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBaseInfoCreateReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceBaseInfoVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /device-info/{id}:
    get:
      tags:
        - 设备基础信息
      summary: 根据ID查询设备基础信息
      operationId: getDeviceBaseInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceBaseInfoVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    put:
      tags:
        - 设备基础信息
      summary: 更新设备基础信息
      operationId: updateDeviceBaseInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBaseInfoUpdateReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceBaseInfoVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags:
        - 设备基础信息
      summary: 删除设备基础信息
      operationId: deleteDeviceBaseInfo
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultBoolean'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /device-info/page:
    post:
      tags:
        - 设备基础信息
      summary: 分页查询设备基础信息
      operationId: pageDeviceBaseInfo
      requestBody:
        required: true
        content:
          application/json:
            schema:
