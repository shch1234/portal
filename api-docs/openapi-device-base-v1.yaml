        factoryId:
          type: string
          description: 厂区ID（冗余字段，便于查询）
        workshopId:
          type: string
          description: 车间ID（冗余字段，便于查询）
        productionLineId:
          type: string
          description: 产线ID（冗余字段，便于查询）
