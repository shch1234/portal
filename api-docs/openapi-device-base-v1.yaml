          description: 响应消息
        timestamp:
          type: integer
          format: int64
          description: 时间戳
    CommonResultBoolean:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              type: boolean

    PageResult:
      type: object
      properties:
        total:
          type: integer
          format: int64
        pageNo:
          type: integer
        pageSize:
          type: integer
        totalPages:
          type: integer
        records:
          type: array
          items:
            type: object

