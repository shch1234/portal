openapi: 3.0.3
info:
  title: 效率管理业务模块 API 文档
  description: |
    weili-iot-portal 业务模块中效率管理（efficiency-mgmt）模块的所有 REST API 接口文档。
    
    该文档涵盖了效率指标查询等功能的接口。
    
    对应业务需求：
    - 4.4 能效管理 - 指标范围
    - 4.4.2 指标 Top5
    
    核心功能：
    - 查询指定指标（如OEE）在给定时间点（班次）时，所有设备的相关指标
    - 支持排序（按指标值或设备编号）
    - 支持分页
    - 支持工厂、车间筛选
    
    支持的指标：
    - OEE（综合设备效率）
    - 时间开动率
    - 性能开动率
    - 设备开动率
    - 停机率
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api/v1/efficiency
    description: 效率管理 API 基础路径

tags:
  - name: 效率管理-效率指标
    description: 效率指标查询相关接口

paths:
  # ========== 效率指标查询接口 ==========
  /metrics/query:
    post:
      tags:
        - 效率管理-效率指标
      summary: 查询效率指标列表
      description: |
        查询指定指标在指定班次时，所有设备的指标值。
        
        **功能特点**：
        - 每个指标独立查询（5个指标：OEE、时间开动率、性能开动率、设备开动率、停机率）
        - 查询指定指标（如OEE）在给定时间点（班次）时，所有设备的相关指标
        - 支持查询当前班次实时指标（不传shiftDate和shiftCode时自动使用当前班次）
        - 支持排序切换（按指标值或设备编号，升序/降序）
        - 支持分页
        - 支持工厂、车间筛选
        
        **排序说明**：
        - 停机率默认升序（越低越好）
        - 其他指标默认降序（越高越好）
        - 可通过sortDirection参数切换排序方向
        
        **使用场景**：
        - 查看某个班次所有设备的OEE排名
        - 查看某个班次所有设备的时间开动率排序
        - 查看当前班次实时指标（不传班次信息）
        - 效率指标排行榜
      operationId: getDeviceMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
          description: 租户ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EfficiencyMetricQueryReq'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultPageResultDeviceEfficiencyMetricVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  # ========== 当前班次实时指标查询接口 ==========
  /metrics/current:
    post:
      tags:
        - 效率管理-效率指标
      summary: 查询当前班次实时指标列表
      description: |
        查询指定指标在当前班次时，所有设备的实时指标值。
        
        这是查询当前班次实时指标的便捷接口，等同于不传shiftDate和shiftCode的/query接口。
        
        **功能特点**：
        - 自动使用当前班次（根据当前时间计算，默认2班制：08:00-20:00 和 20:00-次日08:00）
        - 支持5个指标：OEE、时间开动率、性能开动率、设备开动率、停机率
        - 支持排序切换
        - 支持分页
        - 支持工厂、车间筛选
        
        **使用场景**：
        - 实时查看当前班次所有设备的指标排名
        - 效率指标实时监控
      operationId: getCurrentShiftMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: tenantId
          in: query
          required: true
          schema:
            type: string
          description: 租户ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EfficiencyMetricQueryReq'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultPageResultDeviceEfficiencyMetricVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    # ========== 请求模型 ==========
    EfficiencyMetricQueryReq:
      type: object
      description: 效率指标查询请求
      required:
        - factoryId
        - metricCode
      properties:
        factoryId:
          type: string
          description: 工厂ID（必填，用于数据隔离）
        workshopId:
          type: string
          description: 车间ID（可选，如果不填则查询该工厂下所有车间的设备）
        metricCode:
          type: string
          enum:
            - oee
            - timeAvailability
            - performanceRate
            - equipmentAvailability
            - downtimeRate
          description: |
            指标代码（必填）
            - oee: OEE（综合设备效率）
            - timeAvailability: 时间开动率
            - performanceRate: 性能开动率
            - equipmentAvailability: 设备开动率
            - downtimeRate: 停机率
        shiftDate:
          type: string
          format: date
          description: |
            班次日期（可选，格式：yyyy-MM-dd，如：2024-01-20）
            - 如果不填，则自动使用当前班次日期（实时查询）
        shiftCode:
          type: string
          enum:
            - SHIFT_1
            - SHIFT_2
            - SHIFT_3
          description: |
            班次编码（可选）
            - SHIFT_1: 早班（08:00-20:00）
            - SHIFT_2: 晚班（20:00-次日08:00）
            - SHIFT_3: 夜班
            - 如果不填，则自动使用当前班次编码（实时查询）
        sortBy:
          type: string
          enum:
            - metricValue
            - deviceCode
          default: metricValue
          description: |
            排序字段（可选，默认按指标值降序）
            - metricValue: 按指标值排序
            - deviceCode: 按设备编号排序
        sortDirection:
          type: string
          enum:
            - ASC
            - DESC
          description: |
            排序方向（可选，可切换）
            - ASC: 升序
            - DESC: 降序
            - 默认值：停机率默认为ASC（越低越好），其他指标默认为DESC（越高越好）
        pageNo:
          type: integer
          default: 1
          description: 分页页码（默认1）
        pageSize:
          type: integer
          default: 10
          description: 分页大小（默认10）

    # ========== 响应模型 ==========
    DeviceEfficiencyMetricVO:
      type: object
      description: 设备效率指标VO
      properties:
        deviceId:
          type: string
          description: 设备ID
        deviceCode:
          type: string
          description: 设备编号（威力编号）
        deviceName:
          type: string
          description: 设备名称
        deviceType:
          type: string
          description: 设备类型
        deviceSubType:
          type: string
          description: 设备子类型
        workshopId:
          type: string
          description: 车间ID
        workshopName:
          type: string
          description: 车间名称
        shiftDate:
          type: string
          format: date
          description: 班次日期
        shiftCode:
          type: string
          description: 班次编码（SHIFT_1、SHIFT_2、SHIFT_3）
        metricCode:
          type: string
          description: 指标代码（如：oee、timeAvailability等）
        metricName:
          type: string
          description: 指标名称（如：OEE、时间开动率等）
        metricValue:
          type: number
          format: decimal
          description: 指标值（百分比，如：85.5表示85.5%）
        metricUnit:
          type: string
          description: 指标单位（如：%）
        isFinalized:
          type: boolean
          description: 是否已最终确定（班次结束后为true）

    # ========== 通用响应模型 ==========
    CommonResult:
      type: object
      description: 通用响应结果
      properties:
        code:
          type: integer
          description: 响应码（200表示成功）
        message:
          type: string
          description: 响应消息
        timestamp:
          type: integer
          format: int64
          description: 时间戳

    PageResult:
      type: object
      description: 分页结果基类
      properties:
        total:
          type: integer
          format: int64
          description: 总记录数
        pageNo:
          type: integer
          description: 当前页码
        pageSize:
          type: integer
          description: 每页条数
        totalPages:
          type: integer
          description: 总页数
        records:
          type: array
          description: 数据列表

    # ========== 响应包装模型 ==========
    CommonResultPageResultDeviceEfficiencyMetricVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              allOf:
                - $ref: '#/components/schemas/PageResult'
                - type: object
                  properties:
                    records:
                      type: array
                      items:
                        $ref: '#/components/schemas/DeviceEfficiencyMetricVO'

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResult'

    Unauthorized:
      description: 未授权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResult'

    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResult'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token认证

