openapi: 3.0.3
info:
  title: 数字大屏业务模块 API 文档
  description: |
    weili-iot-portal 业务模块中数字大屏（digital-screen）模块的 REST API 接口文档。
    
    功能覆盖：
    - 厂区布局图
    - 设备状态监测
    - 报警排行
    - 工厂级效率指标（平均 OEE、平均设备利用率）
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api/digital-screen/v1
    description: 数字大屏 API 基础路径

tags:
  - name: 数字大屏-布局图
    description: 厂区布局图相关接口
  - name: 数字大屏-状态监测
    description: 设备状态统计接口
  - name: 数字大屏-报警排行
    description: 报警时长排行接口
  - name: 数字大屏-工厂效率
    description: 工厂级效率指标接口

paths:
  /factories/{factoryId}/layout:
    get:
      tags:
        - 数字大屏-布局图
      summary: 查询厂区布局图数据
      description: 返回指定厂区下所有设备的布局展示信息（设备编号、类型、型号、当前状态等），用于前端绘制厂区布局图和跳转设备详情。
      operationId: getFactoryLayout
      security:
        - bearerAuth: []
      parameters:
        - name: factoryId
          in: path
          required: true
          schema:
            type: string
          description: 厂区ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultFactoryLayoutVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /factories/{factoryId}/status-summary:
    get:
      tags:
        - 数字大屏-状态监测
      summary: 查询厂区设备状态统计数据
      description: 聚合指定厂区内设备的加工中、待机、故障、关机数量及占比，用于状态监测圆环图展示。
      operationId: getFactoryStatusSummary
      security:
        - bearerAuth: []
      parameters:
        - name: factoryId
          in: path
          required: true
          schema:
            type: string
          description: 厂区ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultFactoryStatusSummaryVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /factories/{factoryId}/alarm-ranking:
    get:
      tags:
        - 数字大屏-报警排行
      summary: 查询厂区当前报警时长Top
      description: |
        返回指定厂区当前正在报警且持续时长最长的若干条记录，默认返回 Top5，可通过 `limit` 参数自定义数量。
      operationId: getAlarmRanking
      security:
        - bearerAuth: []
      parameters:
        - name: factoryId
          in: path
          required: true
          schema:
            type: string
          description: 厂区ID
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 5
          description: 返回的排行数量，默认5条
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultAlarmRankingList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /factories/{factoryId}/metrics:
    get:
      tags:
        - 数字大屏-工厂效率
      summary: 查询工厂级效率指标（平均OEE、平均设备利用率）
      description: |
        返回指定厂区的实时平均 OEE、平均设备利用率，以及最近 N 天（含当日）按班次的历史趋势数据。  
        历史天数通过 `days` 参数配置，默认 7 天；若历史数据不足 N 天，将返回现有数据。
      operationId: getFactoryMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: factoryId
          in: path
          required: true
          schema:
            type: string
          description: 厂区ID
        - name: days
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 7
          description: 历史趋势展示天数（按班次计算），默认7天，可根据前端需求传入
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultFactoryMetricsVO'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  schemas:
    FactoryLayoutVO:
      type: object
      description: 厂区布局图数据
      properties:
        factoryId:
          type: string
          description: 厂区ID
        factoryName:
          type: string
          description: 厂区名称
        devices:
          type: array
          description: 设备列表
          items:
            $ref: '#/components/schemas/FactoryLayoutDeviceVO'

    FactoryLayoutDeviceVO:
      type: object
      description: 布局图中的设备展示信息
      properties:
        deviceId:
          type: string
          description: 设备ID
        deviceCode:
          type: string
          description: 设备编号（威力编号）
        deviceTypeName:
          type: string
          description: 设备类型名称
        deviceSubTypeName:
          type: string
          description: 设备子类型名称
        modelName:
          type: string
          description: 规格型号
        currentStatus:
          type: string
          description: 当前状态（加工中/待机/故障/关机/未知）

    FactoryStatusSummaryVO:
      type: object
      description: 厂区设备状态统计
      properties:
        factoryId:
          type: string
          description: 厂区ID
        factoryName:
          type: string
          description: 厂区名称
        totalCount:
          type: integer
          format: int64
          description: 设备总数
        runningCount:
          type: integer
          format: int64
          description: 加工中数量
        standbyCount:
          type: integer
          format: int64
          description: 待机数量
        faultCount:
          type: integer
          format: int64
          description: 故障数量
        shutdownCount:
          type: integer
          format: int64
          description: 关机数量
        runningRatio:
          type: number
          format: double
          description: 加工中占比（0-1）
        standbyRatio:
          type: number
          format: double
          description: 待机占比（0-1）
        faultRatio:
          type: number
          format: double
          description: 故障占比（0-1）
        shutdownRatio:
          type: number
          format: double
          description: 关机占比（0-1）

    AlarmRankingVO:
      type: object
      description: 报警时长排行单条记录
      properties:
        deviceCode:
          type: string
          description: 设备编号
        deviceTypeName:
          type: string
          description: 设备类型
        deviceSubTypeName:
          type: string
          description: 设备子类型
        alarmText:
          type: string
          description: 报警内容
        durationMs:
          type: integer
          format: int64
          description: 报警持续时长（毫秒）

    FactoryMetricsVO:
      type: object
      description: 工厂级效率指标（实时 + 历史）
      properties:
        factoryId:
          type: string
          description: 厂区ID
        factoryName:
          type: string
          description: 厂区名称
        currentAverageOee:
          type: number
          format: double
          description: 当前平均 OEE（0-100，百分比）
        currentAverageUtilizationRate:
          type: number
          format: double
          description: 当前平均设备利用率（0-100，百分比）
        historyTrend:
          type: array
          description: 历史趋势数据（按班次）
          items:
            $ref: '#/components/schemas/FactoryMetricsTrendVO'

    FactoryMetricsTrendVO:
      type: object
      description: 工厂级效率指标历史趋势
      properties:
        shiftDate:
          type: string
          format: date
          description: 班次日期
        shiftCode:
          type: string
          description: 班次编码
        shiftName:
          type: string
          description: 班次名称
        averageOee:
          type: number
          format: double
          description: 平均 OEE（百分比）
        averageUtilizationRate:
          type: number
          format: double
          description: 平均设备利用率（百分比）

    CommonResult:
      type: object
      description: 通用响应结果
      properties:
        code:
          type: integer
          description: 响应码（200 表示成功）
        message:
          type: string
          description: 响应消息
        timestamp:
          type: integer
          format: int64
          description: 时间戳

    CommonResultFactoryLayoutVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FactoryLayoutVO'

    CommonResultFactoryStatusSummaryVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FactoryStatusSummaryVO'

    CommonResultAlarmRankingList:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: '#/components/schemas/AlarmRankingVO'

    CommonResultFactoryMetricsVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/FactoryMetricsVO'

  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResult'
    Unauthorized:
      description: 未授权访问
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResult'
    InternalServerError:
      description: 服务器内部错误
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/CommonResult'

  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT Bearer Token 认证

