    # ========== 设备基础信息模型 ==========
    DeviceBaseInfoVO:
      type: object
      properties:
        id:
          type: string
          description: 设备基础信息 ID
        tenantId:
          type: string
          description: 租户 ID
        tbDeviceId:
          type: string
          description: ThingsBoard 设备 ID
        deviceCode:
          type: string
          description: 设备编号
        deviceName:
          type: string
          description: 设备名称
        deviceTypeId:
          type: string
          description: 设备类型 ID
        deviceModelId:
          type: string
          description: 设备型号 ID
        deviceTypeName:
          type: string
          description: 设备类型名称
        deviceSubTypeName:
          type: string
          description: 设备子类型名称
        modelName:
          type: string
          description: 型号名称
        manufacturer:
          type: string
          description: 制造商
        factoryId:
          type: string
          description: 厂区 ID
        workshopId:
          type: string
          description: 车间 ID
        productionLineId:
          type: string
          description: 产线 ID
        factoryName:
          type: string
          description: 厂区名称
        workshopName:
          type: string
          description: 车间名称
        productionLineName:
          type: string
          description: 产线名称
        deviceStatus:
          type: string
          description: 设备状态
        isMonitored:
          type: boolean
          description: 是否监控
        extraProperties:
          type: object
          additionalProperties: true
          description: 扩展属性
        remarks:
          type: string
          description: 备注
        createdTime:
          type: integer
          format: int64
          description: 创建时间（毫秒时间戳）
        updatedTime:
          type: integer
          format: int64
          description: 更新时间（毫秒时间戳）
        createdBy:
          type: string
          description: 创建人
        updatedBy:
          type: string
          description: 更新人
    
    DeviceBaseInfoCreateReq:
      type: object
      required:
        - deviceCode
        - deviceName
        - deviceTypeId
        - deviceModelId
        - organizationUnitId
      properties:
        deviceCode:
          type: string
          description: 设备编号
        deviceName:
          type: string
          description: 设备名称
        deviceTypeId:
          type: string
          description: 设备类型 ID
        deviceModelId:
          type: string
          description: 设备型号 ID
        organizationUnitId:
          type: string
          description: 组织单元（厂区/部门）ID
        tbDeviceId:
          type: string
          description: TB 设备 ID
        deviceTypeName:
          type: string
          description: 设备类型名称
