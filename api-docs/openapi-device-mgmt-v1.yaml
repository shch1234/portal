    delete:
      tags:
        - 设备管理-设备类型
      summary: 删除设备类型
      operationId: deleteDeviceType
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备类型 ID
      responses:
        '200':
          description: 删除成功
          content:
