openapi: 3.0.3
info:
  title: 设备管理业务模块 API 文档
  description: |
    weili-iot-portal 业务模块中设备管理（device-mgmt）模块的所有 REST API 接口文档。
    
    该文档涵盖了设备基础信息、设备类型、设备型号、设备配置、设备参数、设备关系、
    组织单元、设备指标、实时曲线、报警历史、状态统计、状态甘特图和产量统计等功能的接口。
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: /api/device-mgmt/v1
    description: 设备管理 API 基础路径

tags:
  - name: 设备管理-设备基础信息
    description: 设备基础信息的增删改查接口
  - name: 设备管理-设备类型
    description: 设备类型的增删改查接口
  - name: 设备管理-设备型号
    description: 设备型号的增删改查接口
  - name: 设备管理-设备配置
    description: 设备配置的增删改查接口
  - name: 设备管理-设备参数
    description: 设备参数的查询和更新接口
  - name: 设备管理-设备关系
    description: 设备关系的增删改查接口
  - name: 设备管理-组织单元
    description: 组织单元的增删改查接口
  - name: 设备管理-设备指标
    description: 设备指标查询接口
  - name: 设备管理-实时曲线
    description: 设备实时曲线查询接口
  - name: 设备管理-报警历史
    description: 报警历史查询接口
  - name: 设备管理-状态统计
    description: 设备状态统计查询接口
  - name: 设备管理-状态时间线
    description: 设备状态甘特图查询接口
  - name: 设备管理-产量统计
    description: 产量统计查询接口
  - name: 设备管理-设备列表
    description: 设备列表查询接口
  - name: 设备管理-刀具信息
    description: 刀具信息查询接口
  - name: 设备管理-程序信息
    description: 程序信息查询接口
  - name: 设备管理-轴坐标
    description: 轴坐标查询接口

paths:
  # ========== 设备基础信息接口 ==========
  /device-base-info:
    post:
      tags:
        - 设备管理-设备基础信息
      summary: 创建设备基础信息
      operationId: createDeviceBaseInfo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBaseInfoCreateReq'
      responses:
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceBaseInfoVO'
  
  /device-base-info/{id}:
    get:
      tags:
        - 设备管理-设备基础信息
      summary: 根据 ID 查询设备基础信息
      operationId: getDeviceBaseInfoById
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备基础信息 ID
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceBaseInfoVO'
    
    put:
      tags:
        - 设备管理-设备基础信息
      summary: 更新设备基础信息
      operationId: updateDeviceBaseInfo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备基础信息 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBaseInfoUpdateReq'
      responses:
        '200':
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceBaseInfoVO'
    
    delete:
      tags:
        - 设备管理-设备基础信息
      summary: 删除设备基础信息
      operationId: deleteDeviceBaseInfo
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
          description: 设备基础信息 ID
      responses:
        '200':
          description: 删除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultBoolean'
  
  /device-base-info/page:
    post:
      tags:
        - 设备管理-设备基础信息
      summary: 分页查询设备基础信息
      operationId: pageDeviceBaseInfo
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceBaseInfoQueryReq'
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultPageResultDeviceBaseInfoVO'

  # ========== 设备列表接口 ==========
