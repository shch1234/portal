components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT 认证令牌

  schemas:
    # ========== 通用响应模型 ==========
    CommonResult:
      type: object
      properties:
        code:
          type: integer
          description: 响应码
        message:
          type: string
          description: 响应消息
        data:
          type: object
          description: 响应数据
    
    CommonResultDeviceBaseInfoVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceBaseInfoVO'
    
    CommonResultDeviceTypeVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceTypeVO'
    
    CommonResultDeviceModelVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceModelVO'
    
    CommonResultDeviceConfigurationVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceConfigurationVO'
    
    CommonResultDeviceParameterVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceParameterVO'
    
    CommonResultDeviceParameterHistoryVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceParameterHistoryVO'
    
    CommonResultDeviceRelationVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceRelationVO'
    
    CommonResultOrganizationUnitVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/OrganizationUnitVO'
    
    CommonResultDeviceMetricHistoryVO:
      allOf:
        - $ref: '#/components/schemas/CommonResult'
        - type: object
          properties:
            data:
              $ref: '#/components/schemas/DeviceMetricHistoryVO'
    
