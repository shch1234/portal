  # ========== 设备指标接口 ==========
  /devices/{deviceId}/metrics/current:
    get:
      tags:
        - 设备管理-设备指标
      summary: 获取当前班次指标
      operationId: getCurrentMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: 设备 ID
        - name: metricCodes
          in: query
          required: false
          description: 需要返回的指标代码，未传则返回全部指标
          schema:
            type: array
            items:
              type: string
          style: form
          explode: true
      responses:
        '200':
          description: 查询成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommonResultDeviceMetricHistoryVO'
  
  /devices/{deviceId}/metrics/shifts-history:
    post:
      tags:
        - 设备管理-设备指标
      summary: 查询历史班次指标
      operationId: getShiftMetrics
      security:
        - bearerAuth: []
      parameters:
        - name: deviceId
          in: path
          required: true
          schema:
            type: string
          description: 设备 ID
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceMetricHistoryReq'
