apollo.bootstrap.enabled=true
apollo.bootstrap.eagerLoad.enabled=true
server.port=8080
spring.application.name=weili-iot-portal
# spring健康检查端口
management.endpoints.web.base-path=/actuator
management.endpoints.web.exposure.include=beans,health,info,prometheus

#apollo配置namespace说明
# 1.默认包含application，无需单独配置
# 2.引入基础组件weili-boot-parent自带的公共namespace，无需单独配置
# 3.业务方自定义的namespace、需要再bean初始化加载之前的namespace此处需要配置
# 临时注释OAuth2 namespace（仅用于测试Webhook功能）
# apollo.bootstrap.namespaces=weili.middleware.oauth2

# ============================================
# 临时禁用OAuth2配置（仅用于测试Webhook功能）
# ============================================
# 注意：此配置仅用于测试，生产环境请移除并修复OAuth2配置
# 1. 禁用OAuth2自动配置
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.security.oauth2.client.servlet.OAuth2ClientAutoConfiguration,\
  com.weili.basic.oauth2.configuration.Oauth2ClientSecurityFilterChainAutoConfiguration

# 2. 启用测试用Security配置（允许所有接口匿名访问）
test.security.oauth2.disabled=true

#log配置，只在debug下打开，生产禁止打开
#logging
#  level:
#    com.weili.iot_portal.dal.mapper: TRACE
#    org.apache.ibatis: TRACE
#    com.baomidou.mybatisplus: DEBUG
#    java.sql: DEBUG
#    java.sql.ResultSet: DEBUG

# ============================================
# Webhook Debug日志配置
# ============================================
# 启用Webhook相关的DEBUG日志，方便观察数据流动
# 注意：生产环境请关闭DEBUG日志，避免日志过多
logging.level.com.weili.iot_portal.web.webhook=DEBUG
logging.level.com.weili.iot_portal.service.ingestion=DEBUG
logging.level.com.weili.iot_portal.service.ingestion.handler=DEBUG
logging.level.com.weili.iot_portal.service.ingestion.support=DEBUG

# ============================================
# Webhook配置（必须与TB端一致）
# ============================================
# Webhook Token（用于签名验证，必须与TB端一致）
# 生成的随机token：pRS8pRUNO8e26TUNw4rmQPOSqg1Kcoy34qR7KZrL63U
webhook.security.token=pRS8pRUNO8e26TUNw4rmQPOSqg1Kcoy34qR7KZrL63U
# 时间戳有效期（毫秒，默认5分钟=300000）
webhook.security.timestamp-validity-ms=300000
# nonce TTL（秒，默认5分钟=300）
webhook.security.nonce-ttl-seconds=300